                    if (shape.type === 'triangle') {
                        hint.textContent = '● 拖动顶点 · 👆 拖动移动 · 🔄 旋转 · 🗑️ 删除';
                    } else if (shape.type === 'ellipse' || shape.type === 'rect') {
                        hint.textContent = '👆 拖动移动 · 🔄 旋转 · 🗑️ 删除';
                    } else {
                        hint.textContent = '👆 拖动图形移动 · 🗑️ 删除';
                    }
                    hint.classList.add('show');
                } else {
                    hint.classList.remove('show');
                }
            }

            function initCanvas(side) {
                const canvas = document.getElementById(`canvas-${side}`);
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const w = Math.max(50, Math.round(rect.width));
                const h = Math.max(50, Math.round(rect.height));
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 4;
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, w, h);
                state[side].canvas = canvas;
                state[side].ctx = ctx;
                state[side].hintEl = document.getElementById(`hint-${side}`);
                state[side].floatingEl = document.getElementById(`floating-${side}`);
                state[side].eraserEl = document.getElementById(`eraser-${side}`);
            }

            function resizeCanvas(side) {
                const s = state[side];
                const canvas = s.canvas;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const w = Math.max(50, Math.round(rect.width));
                const h = Math.max(50, Math.round(rect.height));
                if (w !== canvas.width || h !== canvas.height) {
                    canvas.width = w;
                    canvas.height = h;
                    redrawAll(side);
                    updateHint(side);
                }
            }

            function createColorButtons() {
                const leftPalette = document.querySelector('.color-palette-left');
                const rightPalette = document.querySelector('.color-palette-right');
                leftPalette.innerHTML = '';
                rightPalette.innerHTML = '';
                COLOR_PALETTE.forEach((color) => {
                    const leftBtn = document.createElement('div');
                    leftBtn.className = 'color-btn';
                    leftBtn.style.backgroundColor = color;
                    leftBtn.dataset.color = color;
                    if (color === '#FFFFFF') leftBtn.style.border = '2px solid #aaa';
                    leftPalette.appendChild(leftBtn);

                    const rightBtn = document.createElement('div');
                    rightBtn.className = 'color-btn';
                    rightBtn.style.backgroundColor = color;
                    rightBtn.dataset.color = color;
                    if (color === '#FFFFFF') rightBtn.style.border = '2px solid #aaa';
                    rightPalette.appendChild(rightBtn);
                });
                const leftFirst = leftPalette.children[0];
                const rightFirst = rightPalette.children[0];
                if (leftFirst) { leftFirst.classList.add('active-color'); state.left.activeColorBtn = leftFirst; }
                if (rightFirst) { rightFirst.classList.add('active-color'); state.right.activeColorBtn = rightFirst; }
            }

            function setActiveTool(side, tool) {
                const container = document.getElementById(`toolbar-${side}`);
                if (!container) return;
                const btns = container.querySelectorAll('.tool-btn[data-tool]');
                btns.forEach(btn => {
                    const btnTool = btn.dataset.tool;
                    if (btnTool === tool && !['undo', 'redo', 'delete', 'finish', 'ready'].includes(tool)) {
                        btn.classList.add('active-tool');
                    } else if (!['undo', 'redo', 'delete', 'finish', 'ready'].includes(btnTool)) {
                        btn.classList.remove('active-tool');
                    }
                });
            }

            function setColor(side, color, colorBtn) {
                if (state[side].finished) return;
                state[side].color = color;
                if (state[side].tool === 'eraser') setTool(side, 'pen');
                if (state[side].activeColorBtn) state[side].activeColorBtn.classList.remove('active-color');
                if (colorBtn) {
                    colorBtn.classList.add('active-color');
                    state[side].activeColorBtn = colorBtn;
                }
            }

            function applyColorToSelected(side, color) {
                const s = state[side];
                if (s.finished || s.selectedShapeId === null) return;
                const shape = s.shapes.find(sh => sh.id === s.selectedShapeId);
                if (shape) {
                    pushUndo(side);
                    shape.color = color;
                    redrawAll(side);
                }
            }

            function setTool(side, tool) {
                const s = state[side];
                if (s.finished && tool !== 'finish') return;
                if (!s.started && tool !== 'ready' && tool !== 'finish') return;

                if (tool === 'undo') { undo(side); return; }
                if (tool === 'redo') { redo(side); return; }
                if (tool === 'delete') {
                    if (s.selectedShapeId !== null) {
                        pushUndo(side);
                        s.shapes = s.shapes.filter(sh => sh.id !== s.selectedShapeId);
                        s.selectedShapeId = null;
                        redrawAll(side);
                        updateHint(side);
                    }
                    return;
                }
                if (tool === 'ready') { markReady(side); return; }
                if (tool === 'finish') { markFinished(side); return; }

                s.tool = tool;
                setActiveTool(side, tool);
                updateHint(side);

                if (tool !== 'eraser' && s.eraserEl) {
                    s.eraserEl.classList.remove('show');
                }

                if (tool !== 'select') {
                    s.selectedShapeId = null;
                    redrawAll(side);
                    updateHint(side);
                } else {
                    redrawAll(side);
                }
            }

            function markReady(side) {
                const s = state[side];
                if (s.started) return;
                if (s.ready) { cancelReady(side); return; }
                s.ready = true;
                // 若另一侧已在准备中 → 双方一起走共同倒计时
                const other = side === 'left' ? 'right' : 'left';
                if (state[other].ready && !state[other].started && !gameStarted) {
                    startCommonCountdown();
                    return;
                }
                startSideCountdown(side);
            }

            function startCommonCountdown() {
                if (gameStarted) return;
                ['left', 'right'].forEach(side => {
                    const s = state[side];
                    if (s.sideCountTimer) { clearInterval(s.sideCountTimer); s.sideCountTimer = null; }
                    const cntEl = document.getElementById(`count-${side}`);
                    if (cntEl) cntEl.classList.remove('show');
                    const btn = document.getElementById(`ready-${side}`);
                    btn.classList.add('ready');
                    btn.querySelector('.btn-label').textContent = '已准备·再点取消';
                });
                const overlay = document.getElementById('countdownOverlay');
                const numberEl = document.getElementById('countdownNumber');
                let count = 3;
                numberEl.textContent = count;
                overlay.classList.add('show');
                countdownTimer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        numberEl.textContent = count;
                        numberEl.style.animation = 'none';
                        void numberEl.offsetWidth;
                        numberEl.style.animation = 'countPulse 1s ease infinite';
                    } else {
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        overlay.classList.remove('show');
                        startSideGame('left');
                        startSideGame('right');
                    }
                }, 1000);
                updateStatusLabel();
            }

            function startSideCountdown(side) {
                const s = state[side];
                if (s.started) return;
                s.ready = true;
                const btn = document.getElementById(`ready-${side}`);
                btn.classList.add('ready');
                btn.querySelector('.btn-label').textContent = '准备中…再点取消';
                const cntEl = document.getElementById(`count-${side}`);
                let count = 3;
                cntEl.textContent = count;
                cntEl.classList.add('show');
                if (s.sideCountTimer) clearInterval(s.sideCountTimer);
                s.sideCountTimer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        cntEl.textContent = count;
                    } else {
                        clearInterval(s.sideCountTimer);
                        s.sideCountTimer = null;
                        cntEl.classList.remove('show');
                        startSideGame(side);
                    }
                }, 1000);
                updateStatusLabel();
            }

            function cancelReady(side) {
                const s = state[side];
                if (!s.ready || s.started) return;
                s.ready = false;
                if (s.sideCountTimer) { clearInterval(s.sideCountTimer); s.sideCountTimer = null; }
                const cntEl = document.getElementById(`count-${side}`);
                if (cntEl) cntEl.classList.remove('show');
                const btn = document.getElementById(`ready-${side}`);
                btn.classList.remove('ready');
                btn.querySelector('.btn-label').textContent = '我已准备';
                // 共同倒计时运行中取消 → 双方一起退出准备
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    document.getElementById('countdownOverlay').classList.remove('show');
                    const other = side === 'left' ? 'right' : 'left';
                    const os = state[other];
                    if (os.ready && !os.started) {
                        os.ready = false;
                        const obtn = document.getElementById(`ready-${other}`);
                        obtn.classList.remove('ready');
                        obtn.querySelector('.btn-label').textContent = '我已准备';
                    }
                }
                updateStatusLabel();
            }

            function startSideGame(side) {
                const s = state[side];
                if (s.started) return;
                s.started = true;
                s.ready = false;
                if (!gameStarted) {
                    generateRandomReference();
                    gameStarted = true;
                    setRefActionsDisabled(true);
                    setMatchControlsDisabled(true);
                }
                lockCanvas(side, false);
                const btn = document.getElementById(`ready-${side}`);
                btn.classList.remove('ready');
                btn.disabled = true;
                btn.querySelector('.btn-label').textContent = '已开始';
                startSideTimer(side);
                updateStatusLabel();
            }

            // ============ 每侧比赛倒计时 ============
            function updateSideClock(side) {
                const el = document.getElementById(`clock-${side}`);
                if (!el) return;
                const s = state[side];
                el.textContent = '⏱ ' + formatMMSS(s.started ? s.matchRemain : matchSeconds);
                el.classList.toggle('warning', s.started && s.matchRemain <= 10);
            }

            function startSideTimer(side) {
                const s = state[side];
                if (s.matchTimer) clearInterval(s.matchTimer);
                s.matchRemain = matchSeconds;
                updateSideClock(side);
                s.matchTimer = setInterval(() => {
                    s.matchRemain--;
                    updateSideClock(side);
                    if (s.matchRemain <= 0) {
                        clearInterval(s.matchTimer);
                        s.matchTimer = null;
                        updateSideClock(side);
                        if (!s.finished) markFinished(side);
                    }
                }, 1000);
            }

            function stopSideTimer(side) {
                const s = state[side];
                if (s.matchTimer) { clearInterval(s.matchTimer); s.matchTimer = null; }
                updateSideClock(side);
            }

            function markFinished(side) {
                const s = state[side];
                if (s.finished || !s.started) return;
                s.finished = true;
                stopSideTimer(side);
                s.selectedShapeId = null;
                redrawAll(side);
                clearFloatingControls(side);
                if (s.eraserEl) s.eraserEl.classList.remove('show');

                const area = document.getElementById(`canvas-area-${side}`);
                area.classList.add('finished');
                const btn = document.getElementById(`finish-${side}`);
                btn.classList.add('finished');
                btn.querySelector('.btn-label').textContent = '已完成';
                updateHint(side);
                updateStatusLabel();
                checkBothFinished();
            }

            function checkBothFinished() {
                if (state.left.finished && state.right.finished) {
                    showResultOverlay();
                }
                updateStatusLabel();
            }

            // ============ 比赛倒计时 ============
            function formatMMSS(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            function updateMatchClock() {
                const el = document.getElementById('matchClock');
                if (!el) return;
                el.textContent = '⏱ ' + formatMMSS(matchSeconds);
                el.classList.remove('warning');
            }

            function setMatchControlsDisabled(disabled) {
                const area = document.getElementById('matchTimerArea');
                const input = document.getElementById('matchMinutes');
                const btn = document.getElementById('matchApply');
                if (area) area.classList.toggle('disabled', disabled);
                if (input) input.disabled = disabled;
                if (btn) btn.disabled = disabled;
            }

            function applyMatchTime() {
                if (gameStarted) return;
                const input = document.getElementById('matchMinutes');
                let v = parseInt(input.value, 10);
                if (!v || isNaN(v)) v = 3;
                v = Math.max(1, Math.min(60, v));
                input.value = v;
                matchSeconds = v * 60;
                updateMatchClock();
                updateSideClock('left');
                updateSideClock('right');
                const label = document.getElementById('status-label');
                if (label) label.textContent = '⏱ 比赛时长已设为 ' + v + ' 分钟，各自点"我已准备"独立开始';
            }

            function lockCanvas(side, locked) {
                const area = document.getElementById(`canvas-area-${side}`);
                if (locked) area.classList.add('locked');
                else area.classList.remove('locked');
            }

            function checkBothFinished() {
                if (state.left.finished && state.right.finished) {
                    showResultOverlay();
                }
                updateStatusLabel();
            }

            // ============ 橡皮光标 ============
            function updateEraserCursor(side, clientX, clientY) {
                const s = state[side];
                if (!s.eraserEl) return;
                if (s.tool !== 'eraser' || s.finished) {
                    s.eraserEl.classList.remove('show');
                    return;
                }
                const canvas = s.canvas;
                const square = canvas.parentElement;
                const squareRect = square.getBoundingClientRect();
                const relX = clientX - squareRect.left;
                const relY = clientY - squareRect.top;
                s.eraserEl.style.left = relX + 'px';
                s.eraserEl.style.top = relY + 'px';
                s.eraserEl.classList.add('show');
            }

            function hideEraserCursor(side) {
                const s = state[side];
                if (s.eraserEl) s.eraserEl.classList.remove('show');
            }

            // ============ 画布事件 ============
            function setupDrawingEvents(side) {
                const s = state[side];
                const canvas = s.canvas;
                const ctx = s.ctx;
                if (!canvas) return;

                function onMouseDown(e) {
                    if (s.finished || !s.started) return;
                    if (s.dragMode !== null) return;
                    if (e.target !== canvas) return;
                    const coords = getCanvasCoordsFromEvent(side, e);
                    if (!coords) return;
                    const tool = s.tool;
                    e.preventDefault();
                    s.activePointerId = e.pointerId;

                    if (tool === 'fill') {
                        pushUndo(side);
                        // 记录填充点击位置所属的图形，供顶点编辑/删除时联动处理
                        let ownerId = null;
                        for (const sh of s.shapes) {
                            if (sh.type === 'fill' || (sh.type === 'pen' && sh.eraser)) continue;
                            if (pointInShapeInterior(coords.x, coords.y, sh)) { ownerId = sh.id; break; }
                        }
                        const fillShape = {
                            id: shapeIdCounter++,
                            type: 'fill',
                            x: coords.x,
                            y: coords.y,
                            color: s.color,
                            ownerId: ownerId,
                        };
                        s.shapes.push(fillShape);
                        redrawAll(side);
                        return;
                    }

                    if (tool === 'select') {
                        if (s.selectedShapeId !== null) {
                            const sel = s.shapes.find(sh => sh.id === s.selectedShapeId);
                            if (sel && sel.type !== 'fill' && isPointOnShape(sel, coords.x, coords.y)) {
                                s.dragMode = 'move';
                                s.dragStartX = coords.x;
                                s.dragStartY = coords.y;
                                s.dragStartSnapshot = JSON.parse(JSON.stringify(s.shapes));
                                bringShapeToTop(side, sel.id);
                                canvas.classList.add('moving');
                                startGlobalDrag(side);
                                return;
                            }
                        }
                        const shape = findShapeAt(side, coords.x, coords.y);
                        if (shape) {
                            s.selectedShapeId = shape.id;
                            redrawAll(side);
                            updateHint(side);
                        } else {
                            s.selectedShapeId = null;
                            redrawAll(side);
                            updateHint(side);
                        }
                        return;
                    }

                    s.dragMode = 'draw';
                    s.drawStartX = coords.x; s.drawStartY = coords.y;
                    s.drawLastX = coords.x; s.drawLastY = coords.y;

                    if (tool === 'pen' || tool === 'eraser') {
                        if (tool === 'eraser') {
                            if (e.clientX !== undefined) updateEraserCursor(side, e.clientX, e.clientY);
                            else if (e.touches && e.touches[0]) updateEraserCursor(side, e.touches[0].clientX, e.touches[0].clientY);
                        }
                        s.currentShape = {
                            id: shapeIdCounter++,
                            type: 'pen',
                            color: tool === 'eraser' ? '#FFFFFF' : s.color,
                            lineWidth: tool === 'eraser' ? 14 : s.lineWidth,
                            eraser: tool === 'eraser',
                            points: [{ x: coords.x, y: coords.y }],
                        };
                        ctx.fillStyle = s.currentShape.color;
                        ctx.beginPath();
                        ctx.arc(coords.x, coords.y, s.currentShape.lineWidth / 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        s.savedImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        s.currentShape = null;
                    }

                    startGlobalDragForDraw(side);
                }

                canvas.addEventListener('pointerdown', onMouseDown);

                canvas.addEventListener('pointermove', (e) => {
                    if (s.finished || !s.started) return;
                    if (s.tool !== 'eraser') return;
                    if (s.dragMode === 'draw') return;
                    updateEraserCursor(side, e.clientX, e.clientY);
                });
                canvas.addEventListener('pointerleave', () => {
                    if (s.dragMode !== 'draw') hideEraserCursor(side);
                });
            }

            function startGlobalDragForDraw(side) {
                const s = state[side];
                stopGlobalDragForDraw(side);

                const onMove = (ev) => {
                    if (s.dragMode !== 'draw') return;
                    if (ev.pointerId !== s.activePointerId) return;
                    const coords = getCanvasCoordsFromEvent(side, ev);
                    if (!coords) return;
                    ev.preventDefault();
                    ev.stopPropagation();
                    const tool = s.tool;
                    const ctx = s.ctx;

                    if (tool === 'eraser') {
                        let cx, cy;
                        if (ev.touches && ev.touches[0]) {
                            cx = ev.touches[0].clientX; cy = ev.touches[0].clientY;
                        } else if (ev.clientX !== undefined) {
                            cx = ev.clientX; cy = ev.clientY;
                        }
                        if (cx !== undefined) updateEraserCursor(side, cx, cy);
                    }

                    if (tool === 'pen' || tool === 'eraser') {
                        if (s.currentShape) {
                            s.currentShape.points.push({ x: coords.x, y: coords.y });
                            ctx.strokeStyle = s.currentShape.color;
                            ctx.lineWidth = s.currentShape.lineWidth;
                            ctx.beginPath();
                            ctx.moveTo(s.drawLastX, s.drawLastY);
                            ctx.lineTo(coords.x, coords.y);
                            ctx.stroke();
                            s.drawLastX = coords.x; s.drawLastY = coords.y;
                        }
                    } else {
                        if (s.savedImageData) ctx.putImageData(s.savedImageData, 0, 0);
                        const preview = makePreviewShape(tool, s.drawStartX, s.drawStartY, coords.x, coords.y, s.color, s.lineWidth);
                        if (preview) drawShapeOnCtx(ctx, preview);
                    }
                };

                const onUp = (ev) => {
                    if (s.dragMode !== 'draw') return;
                    if (ev.pointerId !== s.activePointerId) return;
                    ev.preventDefault && ev.preventDefault();
                    ev.stopPropagation && ev.stopPropagation();
                    const coords = getCanvasCoordsFromEvent(side, ev) || { x: s.drawLastX, y: s.drawLastY };
                    const tool = s.tool;
                    const ctx = s.ctx;

                    if (tool === 'pen' || tool === 'eraser') {
                        if (s.currentShape && s.currentShape.points.length > 0) {
                            pushUndo(side);
                            s.shapes.push(s.currentShape);
                            s.currentShape = null;
                            redrawAll(side);
                        }
                        if (tool === 'eraser') hideEraserCursor(side);
                    } else {
                        const shape = makeFinalShape(tool, s.drawStartX, s.drawStartY, coords.x, coords.y, s.color, s.lineWidth);
                        if (shape) {
                            pushUndo(side);
                            s.shapes.push(shape);
                            s.currentShape = null;
                            redrawAll(side);
                        }
                        s.savedImageData = null;
                    }
                    s.dragMode = null;
                    s.activePointerId = null;
                    stopGlobalDragForDraw(side);
                };

                s.drawMoveHandler = onMove;
                s.drawUpHandler = onUp;
                window.addEventListener('pointermove', onMove, true);
                window.addEventListener('pointerup', onUp, true);
                window.addEventListener('pointercancel', onUp, true);
            }

            function stopGlobalDragForDraw(side) {
                const s = state[side];
                if (s.drawMoveHandler) {
                    window.removeEventListener('pointermove', s.drawMoveHandler, true);
                    s.drawMoveHandler = null;
                }
                if (s.drawUpHandler) {
                    window.removeEventListener('pointerup', s.drawUpHandler, true);
                    window.removeEventListener('pointercancel', s.drawUpHandler, true);
                    s.drawUpHandler = null;
                }
            }

            function setupToolButtons() {
                function handleClick(e, side) {
                    const target = e.target.closest('.tool-btn');
                    if (!target) return;
                    const width = target.dataset.width;
                    if (width) { setLineWidth(side, parseInt(width, 10)); return; }
                    const tool = target.dataset.tool;
                    if (!tool) return;
                    setTool(side, tool);
                }
                document.getElementById('toolbar-left').addEventListener('pointerdown', (e) => { e.preventDefault(); handleClick(e, 'left'); });
                document.getElementById('toolbar-right').addEventListener('pointerdown', (e) => { e.preventDefault(); handleClick(e, 'right'); });
            }

            function setupColorEvents() {
                function handleColor(e, side) {
                    const target = e.target.closest('.color-btn');
                    if (!target) return;
                    const color = target.dataset.color;
                    if (color) {
                        setColor(side, color, target);
                        if (state[side].selectedShapeId !== null) applyColorToSelected(side, color);
                    }
                }
                document.querySelector('.color-palette-left').addEventListener('pointerdown', (e) => { e.preventDefault(); handleColor(e, 'left'); });
                document.querySelector('.color-palette-right').addEventListener('pointerdown', (e) => { e.preventDefault(); handleColor(e, 'right'); });
            }

            // ============ 状态栏 ============
            function updateStatusLabel() {
                const label = document.getElementById('status-label');
                const L = state.left, R = state.right;
                if (L.finished && R.finished) {
                    label.textContent = '👏 双方都完成了！大家一起欣赏讨论吧～';
                } else if (L.finished) {
                    label.textContent = '✅ 左边已完成，等待右边…';
                } else if (R.finished) {
                    label.textContent = '✅ 右边已完成，等待左边…';
                } else if (L.started && R.started) {
                    label.textContent = '🎨 两人都在画，加油！';
                } else if (L.started) {
                    label.textContent = '🎨 左边同学比赛中，右边可随时点"我已准备"加入';
                } else if (R.started) {
                    label.textContent = '🎨 右边同学比赛中，左边可随时点"我已准备"加入';
                } else if (countdownTimer) {
                    label.textContent = '✨ 双方已准备，3 秒后同时开始！';
                } else if (L.ready || R.ready) {
                    label.textContent = '⏳ 准备中，各自点"我已准备"独立开始';
                } else {
                    label.textContent = '✨ 各自点"我已准备"：双方都点则一起开始，单方点则独立开始';
                }
            }

            // ============ 确认弹窗 ============
            function askConfirm(text, onOk) {
                document.getElementById('confirmText').textContent = text;
                confirmCallback = onOk;
                document.getElementById('confirmOverlay').classList.add('show');
            }

            // ============ 参考图占位 ============
            function drawRefPlaceholder() {
                refCtx.fillStyle = '#FFFFFF';
                refCtx.fillRect(0, 0, REF_SIZE, REF_SIZE);
                refCtx.fillStyle = '#cccccc';
                refCtx.font = 'bold 40px sans-serif';
                refCtx.textAlign = 'center';
                refCtx.textBaseline = 'middle';
                refCtx.fillText('准备后出图', REF_SIZE / 2, REF_SIZE / 2);
                document.getElementById('ref-footer').textContent = '准备后自动出图';
            }

            // ============ 参考图导入 ============
            function drawRefImageContain(img) {
                refCtx.fillStyle = '#FFFFFF';
                refCtx.fillRect(0, 0, REF_SIZE, REF_SIZE);
                const scale = Math.min(REF_SIZE / img.width, REF_SIZE / img.height, 1);
                const w = img.width * scale, h = img.height * scale;
                refCtx.drawImage(img, (REF_SIZE - w) / 2, (REF_SIZE - h) / 2, w, h);
            }

            function loadReferenceFromFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        customRefActive = true;
                        customRefImg = img;
                        drawRefImageContain(img);
                        document.getElementById('ref-footer').textContent = '本张参考图：自定义图片';
                    };
                    img.onerror = () => alert('图片读取失败，请换一张试试');
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function setRefActionsDisabled(disabled) {
                document.getElementById('import-ref-btn').disabled = disabled;
                document.getElementById('random-ref-btn').disabled = disabled;
            }

            function setupRefImport() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.style.display = 'none';
                input.addEventListener('change', (e) => {
                    const f = e.target.files && e.target.files[0];
                    if (f) loadReferenceFromFile(f);
                    input.value = '';
                });
                document.body.appendChild(input);
                document.getElementById('import-ref-btn').addEventListener('click', () => input.click());
                document.getElementById('random-ref-btn').addEventListener('click', () => {
                    customRefActive = false;
                    customRefImg = null;
                    generateRandomReference();
                });
            }

            // ============ 结果展示 ============
            function showResultOverlay() {
                const rr = document.getElementById('result-ref');
                rr.width = REF_SIZE; rr.height = REF_SIZE;
                rr.getContext('2d').drawImage(document.getElementById('reference-canvas'), 0, 0);
                const lc = document.getElementById('result-left');
                lc.width = state.left.canvas.width; lc.height = state.left.canvas.height;
                lc.getContext('2d').drawImage(state.left.canvas, 0, 0);
                const rc = document.getElementById('result-right');
                rc.width = state.right.canvas.width; rc.height = state.right.canvas.height;
                rc.getContext('2d').drawImage(state.right.canvas, 0, 0);
                document.getElementById('resultOverlay').classList.add('show');
            }

            // ============ 轮次管理 ============
            function clearRound(side) {
                const s = state[side];
                s.shapes = [];
                s.selectedShapeId = null;
                s.undoStack = [];
                s.redoStack = [];
                s.currentShape = null;
                s.dragMode = null;
                stopGlobalDrag(side);
                stopGlobalDragForDraw(side);
                hideEraserCursor(side);
                redrawAll(side);
                updateHint(side);
            }

            function resetRoundState(gameStartImmediately) {
                ['left', 'right'].forEach(side => {
                    clearRound(side);
                    const s = state[side];
                    s.ready = false;
                    s.finished = false;
                    s.started = false;
                    if (s.sideCountTimer) { clearInterval(s.sideCountTimer); s.sideCountTimer = null; }
                    stopSideTimer(side);
                    s.tool = 'pen';
                    const cntEl = document.getElementById(`count-${side}`);
                    if (cntEl) cntEl.classList.remove('show');
                    const rBtn = document.getElementById(`ready-${side}`);
                    rBtn.disabled = false;
                    rBtn.classList.remove('ready');
                    rBtn.querySelector('.btn-label').textContent = '我已准备';
                    const fBtn = document.getElementById(`finish-${side}`);
                    fBtn.classList.remove('finished');
                    fBtn.querySelector('.btn-label').textContent = '我已完成';
                    document.getElementById(`canvas-area-${side}`).classList.remove('finished');
                    document.getElementById(`canvas-area-${side}`).classList.remove('locked');
                    setActiveTool(side, 'pen');
                });
                document.getElementById('bothReadyToast').classList.remove('show');
                document.getElementById('countdownOverlay').classList.remove('show');
                document.getElementById('resultOverlay').classList.remove('show');
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

                gameStarted = false;
                setRefActionsDisabled(false);
                setMatchControlsDisabled(false);
                if (gameStartImmediately) {
                    startSideGame('left');
                    startSideGame('right');
                } else {
                    drawRefPlaceholder();
                    lockCanvas('left', true);
                    lockCanvas('right', true);
                }
                updateStatusLabel();
            }

            // ============ 线条粗细 ============
            function setLineWidth(side, w) {
                const s = state[side];
                if (s.finished) return;
                s.lineWidth = w;
                const container = document.getElementById(`toolbar-${side}`);
                if (!container) return;
                container.querySelectorAll('.width-btn').forEach(btn => {
                    btn.classList.toggle('active-tool', parseInt(btn.dataset.width, 10) === w);
                });
            }

            // ============ 重置 ============
            function resetReady() {
                state.left.ready = false;
                state.right.ready = false;
                state.left.finished = false;
                state.right.finished = false;
                state.left.started = false;
                state.right.started = false;
                state.left.dragMode = null;
                state.right.dragMode = null;
                gameStarted = false;
                ['left', 'right'].forEach(side => {
                    const s = state[side];
                    if (s.sideCountTimer) { clearInterval(s.sideCountTimer); s.sideCountTimer = null; }
                    stopSideTimer(side);
                    const cntEl = document.getElementById(`count-${side}`);
                    if (cntEl) cntEl.classList.remove('show');
                    const rBtn = document.getElementById(`ready-${side}`);
                    const fBtn = document.getElementById(`finish-${side}`);
                    rBtn.disabled = false;
                    rBtn.classList.remove('ready');
                    rBtn.querySelector('.btn-label').textContent = '我已准备';
                    fBtn.classList.remove('finished');
                    fBtn.querySelector('.btn-label').textContent = '我已完成';
                    document.getElementById(`canvas-area-${side}`).classList.remove('finished');
                    document.getElementById(`canvas-area-${side}`).classList.remove('locked');
                    clearFloatingControls(side);
                    stopGlobalDrag(side);
                    stopGlobalDragForDraw(side);
                    hideEraserCursor(side);
                });
                document.getElementById('bothReadyToast').classList.remove('show');
                document.getElementById('countdownOverlay').classList.remove('show');
                document.getElementById('resultOverlay').classList.remove('show');
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                updateStatusLabel();
            }

            function init() {
                initRefCanvas();
                drawRefPlaceholder();

                initCanvas('left');
                initCanvas('right');
                createColorButtons();
                setActiveTool('left', 'pen');
                setActiveTool('right', 'pen');
                setColor('left', '#000000', document.querySelector('.color-palette-left .color-btn'));
                setColor('right', '#000000', document.querySelector('.color-palette-right .color-btn'));
                setLineWidth('left', 4);
                setLineWidth('right', 4);
                setupDrawingEvents('left');
                setupDrawingEvents('right');
                setupToolButtons();
                setupColorEvents();

                lockCanvas('left', true);
                lockCanvas('right', true);
                resetReady();

                document.getElementById('confirmOk').addEventListener('click', () => {
                    document.getElementById('confirmOverlay').classList.remove('show');
                    if (confirmCallback) { const cb = confirmCallback; confirmCallback = null; cb(); }
                });
                document.getElementById('confirmCancel').addEventListener('click', () => {
                    document.getElementById('confirmOverlay').classList.remove('show');
                    confirmCallback = null;
                });
                document.getElementById('restart-top').addEventListener('click', () => {
                    askConfirm('确定要重新开始本局吗？双方画布将清空，回到准备阶段。', () => {
                        resetRoundState(false);
                    });
                });
                document.getElementById('next-round-btn').addEventListener('click', () => resetRoundState(true));
                document.getElementById('end-game-btn').addEventListener('click', () => {
                    resetRoundState(false);
                });
                setupRefImport();

                document.getElementById('matchApply').addEventListener('click', applyMatchTime);
                document.getElementById('matchMinutes').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') applyMatchTime();
                });
                updateMatchClock();
                updateSideClock('left');
                updateSideClock('right');

                window.addEventListener('resize', () => {
                    resizeCanvas('left');
                    resizeCanvas('right');
                    updateFloatingControls('left');
                    updateFloatingControls('right');
                });

                window.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'z') {
                        e.preventDefault();
                        undo('left'); undo('right');
                    }
                    if (e.ctrlKey && e.key === 'y') {
                        e.preventDefault();
                        redo('left'); redo('right');
                    }
                });
            }

            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
